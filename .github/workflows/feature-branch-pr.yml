# Opens a PR to main when a feature branch is pushed and no PR exists yet (no manual "Compare & pull request").

name: Feature branch pull request

on:
  push:
    branches: ["feature/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Create pull request if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF#refs/heads/}"
          COUNT=$(gh pr list --repo "${GITHUB_REPOSITORY}" --base main --head "${BRANCH}" --json number --jq 'length')
          if [ "${COUNT}" -eq 0 ]; then
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --head "${BRANCH}" \
              --title "Merge ${BRANCH}" \
              --body "Automatically opened when \`${BRANCH}\` was pushed. Review and merge when ready."
          else
            echo "Pull request already exists for ${BRANCH}."
          fi

# Athena module catalog — static YAML, downloaded on demand from internet or LAN peers.
version: 1

modules:
  - id: ollama-qwen-0.5b
    name: Qwen 2.5 0.5B (local stub)
    category: llm
    description: Tiny local chat model for offline failover via Ollama.
    size_bytes: 400000000
    required: true
    provider: ollama
    ollama_model: qwen2.5:0.5b
    tags: [offline, failover, stub]

  - id: whisper-server
    name: Faster Whisper Server
    category: voice_stt
    description: OpenAI-compatible local STT (fedirz/faster-whisper-server). Auto-starts on install.
    size_bytes: 2500000000
    required: false
    provider: docker
    image_cpu: fedirz/faster-whisper-server:latest-cpu
    image_gpu: fedirz/faster-whisper-server:latest-cuda
    container_port: 8000
    host_port: 9000
    health_path: /v1/models
    gpu_capable: true
    register_as_app: true
    tags: [voice, stt, docker]

  - id: kokoro-tts
    name: Kokoro TTS (FastAPI)
    category: voice_tts
    description: High-quality local TTS via Kokoro FastAPI container. Auto-starts on install.
    size_bytes: 1200000000
    required: false
    provider: docker
    image_cpu: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    image_gpu: ghcr.io/remsky/kokoro-fastapi-gpu:latest
    container_port: 8880
    host_port: 8880
    health_path: /health
    gpu_capable: true
    register_as_app: true
    tags: [voice, tts, docker]

  - id: comfyui-engine
    name: ComfyUI Engine
    category: multimedia
    description: Local image/video generation — enable Compose profile `comfyui` (GPU-capable host recommended).
    size_bytes: 0
    required: false
    provider: compose_profile
    compose_profile: comfyui
    tags: [image, video, comfyui]

  - id: flux-dev-fp8
    name: Flux Dev (FP8)
    category: image_model
    description: Flux image model weights for ComfyUI.
    size_bytes: 12000000000
    required: false
    depends_on: [comfyui-engine]
    provider: url
    url: ""
    tags: [flux, image]

  - id: survival-knowledge-pack
    name: Survival Knowledge Pack
    category: database
    description: Curated offline knowledge corpus for field RAG.
    size_bytes: 800000000
    required: false
    provider: url
    url: ""
    tags: [rag, knowledge]

[package]
name = "athena"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
rust-version = "1.84"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "athena_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
meshtastic = { version = "0.1.8", features = ["serde", "tokio"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs"] }
tokio-serial = "5.4"
serialport = "4.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
pmtiles2 = "0.3.1"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
image = "0.25"
crossbeam-channel = "0.5"
sysinfo = "0.30"
ureq = { version = "2", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
zim = "0.4"
quick-xml = "0.36"
urlencoding = "2"
sunrise = "1.2"
lopdf = "0.32"
pdf-extract = "0.7"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
hnsw_rs = "0.3"
ndarray = { version = "0.15", features = ["blas"] }
rayon = "1.10"
which = "6"
thiserror = "2"
bytemuck = "1"
zip = "2"
plist = "1"
piper-rs = { version = "0.1.9", default-features = false, optional = true }
riff-wave = { version = "0.1", optional = true }
base64 = { version = "0.22", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-macos-permissions = "2"

[features]
default = []
# Build with: cargo build --features piper-tts (requires cmake and espeak-ng for character voices).
piper-tts = ["piper-rs", "riff-wave", "base64"]


[package]
name = "athena"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
rust-version = "1.84"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "athena_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
meshtastic = { version = "0.1.8", features = ["serde", "tokio"] }
prost = "0.14"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs", "io-std"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
tokio-serial = "5.4"
serialport = "4.6"
mdns-sd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
notify = "6"
# Bundled SQLite is built with SQLITE_ENABLE_FTS5 via libsqlite3-sys; rusqlite exposes no separate `fts5` feature.
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
pmtiles2 = "0.3.1"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
image = "0.25"
crossbeam-channel = "0.5"
sysinfo = "0.30"
keepawake = "0.6"
ureq = { version = "2", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "blocking", "multipart"] }
axum = { version = "0.7", default-features = false, features = ["json", "http1", "tokio", "query"] }
tower-http = { version = "0.5", default-features = false, features = ["fs", "cors"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "io"] }
zim = "0.4"
quick-xml = "0.36"
urlencoding = "2"
sunrise = "1.2"
lopdf = "0.32"
pdf-extract = "0.7"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
hnsw_rs = "0.3"
ndarray = { version = "0.17", default-features = true, features = ["blas"] }
rayon = "1.10"
which = "6"
thiserror = "2"
tempfile = "3"
bytemuck = "1"
regex = "1"
zip = "2"
snap = "1"
tar = "0.4"
flate2 = "1"
zstd = "0.13"
plist = "1"
piper-rs = { version = "0.1.9", default-features = false, optional = true }
riff-wave = { version = "0.1", optional = true }
base64 = "0.22"
tauri-plugin-shell = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
rand = "0.8"
socket2 = "0.5"
geoconvert = "1.0"
osmpbfreader = "0.16"
polyline = "0.3"
sqlite-vec = "0.1.8-alpha.1"
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "download-binaries", "ndarray", "tls-rustls"] }
cpal = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-macos-permissions = "2"
# NSWindow collectionBehavior: disable native fullscreen on the green button (avoids AppKit crash).
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWindow"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1

[features]
default = []
# Build with: cargo build --features piper-tts (requires cmake and espeak-ng for character voices).
piper-tts = ["piper-rs", "riff-wave"]


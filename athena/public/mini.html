<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>ATHENA Mini</title>
<!--
  ATHENA tiny-screen status view.
  For very small screens (240x320 up to 480x320 TFTs, old phones, e-readers, ESP32 display
  clients) and slow browsers: one file, no libraries, ES5 only, no web fonts.
  Served by the LAN bridge from dist/ at http://<station>:8787/mini.html.
  Talks to the same POST /api/invoke endpoint as the full app.
  Optional query: ?refresh=30 (seconds, min 10), ?api=http://host:8787 (when served elsewhere).
-->
<style>
  :root { --bg:#05080d; --fg:#e8eef6; --muted:#8a97a8; --line:#1f2a38; --crit:#ff4d4f; --warn:#ffb020; --ok:#38d07a; --info:#5aa9ff; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); }
  body { font:16px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:6px; padding:max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left)); }
  h1 { font-size:15px; letter-spacing:.12em; margin:0; }
  .bar { display:flex; align-items:center; justify-content:space-between; gap:6px; border-bottom:1px solid var(--line); padding-bottom:4px; margin-bottom:6px; }
  .clock { font-variant-numeric:tabular-nums; font-weight:700; }
  .pill { display:inline-block; border-radius:9px; padding:1px 7px; font-size:12px; font-weight:700; border:1px solid currentColor; }
  .ok { color:var(--ok); } .crit { color:var(--crit); } .warn { color:var(--warn); } .info { color:var(--info); } .muted { color:var(--muted); }
  .headline { font-size:18px; font-weight:700; margin:2px 0 6px; }
  .headline.crit { color:#fff; background:var(--crit); padding:4px 6px; border-radius:4px; }
  ul { list-style:none; margin:0; padding:0; }
  li { border-left:4px solid var(--line); padding:3px 0 3px 6px; margin-bottom:4px; }
  li.crit { border-color:var(--crit); } li.warn { border-color:var(--warn); } li.info { border-color:var(--info); }
  .t { font-weight:700; } .d { font-size:13px; color:var(--muted); }
  h2 { font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:8px 0 3px; }
  .msg .who { font-size:12px; color:var(--info); }
  form { display:block; max-width:22rem; margin:8px auto; }
  label { display:block; font-size:13px; color:var(--muted); margin:6px 0 2px; }
  input, button { width:100%; min-height:44px; font-size:16px; border-radius:6px; border:1px solid var(--line); background:#0d1520; color:var(--fg); padding:0 10px; }
  button { background:#1c6dd0; border-color:#1c6dd0; font-weight:700; margin-top:10px; }
  button.ghost { background:transparent; border-color:var(--line); color:var(--muted); min-height:36px; margin-top:8px; font-size:13px; }
  .err { color:var(--crit); font-size:13px; min-height:1em; margin-top:6px; }
  .foot { margin-top:8px; font-size:11px; color:var(--muted); display:flex; justify-content:space-between; gap:6px; }
  .hidden { display:none !important; }
  /* 240px-wide screens: tighten further. */
  @media (max-width: 260px) {
    body { font-size:14px; padding:4px; }
    .headline { font-size:16px; }
    .d { font-size:12px; }
  }
  /* Wide-but-short TFTs (480x320, 320x240 landscape): two columns. */
  @media (min-width: 420px) and (max-height: 360px) {
    #main { display:flex; gap:8px; }
    #main > section { flex:1 1 0; min-width:0; }
  }
</style>
</head>
<body>
<div class="bar">
  <h1>ATHENA</h1>
  <span id="radio" class="pill muted">RADIO ?</span>
  <span id="clock" class="clock">--:--</span>
</div>

<form id="login" class="hidden" autocomplete="off">
  <div class="headline">Sign in</div>
  <label for="name">Operator name</label>
  <input id="name" name="name" autocapitalize="off" autocorrect="off" spellcheck="false">
  <label for="pin">PIN</label>
  <input id="pin" name="pin" type="password" inputmode="numeric">
  <button type="submit">Sign in</button>
  <div id="loginErr" class="err"></div>
</form>

<div id="main" class="hidden">
  <section>
    <div id="headline" class="headline">Loading…</div>
    <ul id="findings"></ul>
  </section>
  <section>
    <h2>Mesh messages</h2>
    <ul id="msgs"><li class="muted">—</li></ul>
  </section>
</div>

<div class="foot">
  <span id="updated">&nbsp;</span>
  <a id="signout" href="#" class="muted hidden">Sign out</a>
</div>

<script>
(function () {
  "use strict";
  var TOKEN_KEY = "athena_mini_token";
  var q = parseQuery(location.search);
  var API = (q.api || "").replace(/\/$/, "");
  var REFRESH = Math.max(10, parseInt(q.refresh, 10) || 30) * 1000;
  var timer = null;

  function parseQuery(s) {
    var out = {};
    s.replace(/^\?/, "").split("&").forEach(function (kv) {
      if (!kv) return;
      var i = kv.indexOf("=");
      var k = decodeURIComponent(i < 0 ? kv : kv.slice(0, i));
      out[k] = i < 0 ? "" : decodeURIComponent(kv.slice(i + 1).replace(/\+/g, " "));
    });
    return out;
  }
  function $(id) { return document.getElementById(id); }
  function show(id, on) { $(id).className = $(id).className.replace(/\s*hidden/g, "") + (on ? "" : " hidden"); }
  function getToken() { try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; } }
  function setToken(t) { try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch (e) {} }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function two(n) { return (n < 10 ? "0" : "") + n; }
  function hhmm(d) { return two(d.getHours()) + ":" + two(d.getMinutes()); }

  // XHR rather than fetch: works on older embedded browsers.
  function invoke(cmd, args, cb) {
    var x = new XMLHttpRequest();
    x.open("POST", API + "/api/invoke", true);
    x.setRequestHeader("Content-Type", "application/json");
    var t = getToken();
    if (t) x.setRequestHeader("Authorization", "Bearer " + t);
    x.timeout = 20000;
    x.onload = function () {
      var body = {};
      try { body = JSON.parse(x.responseText); } catch (e) {}
      if (body.token) setToken(body.token);
      if (x.status === 200 && body.ok) cb(null, body.result);
      else cb(new Error(body.error || ("HTTP " + x.status)));
    };
    x.onerror = x.ontimeout = function () { cb(new Error("Station not reachable")); };
    x.send(JSON.stringify({ cmd: cmd, args: args || {} }));
  }

  function isAuthError(err) { return /not authenticated|sign in|session/i.test(err && err.message || ""); }

  function tickClock() { $("clock").textContent = hhmm(new Date()); }

  function renderBrief(b) {
    var findings = (b && b.findings) || [];
    var crit = findings.some(function (f) { return f.severity === "critical"; });
    var h = $("headline");
    h.textContent = (b && b.headline) || "All quiet";
    h.className = "headline" + (crit ? " crit" : "");
    var order = { critical: 1, warning: 2, info: 3 };
    findings.sort(function (a, c) { return (order[a.severity] || 4) - (order[c.severity] || 4); });
    var html = "";
    for (var i = 0; i < findings.length && i < 8; i++) {
      var f = findings[i];
      var cls = f.severity === "critical" ? "crit" : f.severity === "warning" ? "warn" : "info";
      html += '<li class="' + cls + '"><div class="t">' + esc(f.title) + '</div><div class="d">' + esc(f.detail) + "</div></li>";
    }
    if (!findings.length) html = '<li class="ok">No alerts.</li>';
    $("findings").innerHTML = html;
  }

  function renderMsgs(rows) {
    if (!rows.length) { $("msgs").innerHTML = '<li class="muted">No mesh messages.</li>'; return; }
    rows.sort(function (a, b) { return b.createdAt - a.createdAt; });
    var html = "";
    for (var i = 0; i < rows.length && i < 5; i++) {
      var r = rows[i];
      var who = r.senderType === "ai" ? "Athena" : r.senderType === "human" ? "Operator" : (r.username || ("!" + Number(r.nodeId).toString(16)));
      var when = r.createdAt ? hhmm(new Date(r.createdAt > 1e12 ? r.createdAt : r.createdAt * 1000)) : "";
      html += '<li class="msg"><div class="who">' + esc(who) + " · " + when + '</div><div>' + esc(r.content) + "</div></li>";
    }
    $("msgs").innerHTML = html;
  }

  function loadMesh() {
    invoke("is_mesh_radio_connected", {}, function (err, on) {
      var el = $("radio");
      if (err) { el.textContent = "RADIO ?"; el.className = "pill muted"; return; }
      el.textContent = on ? "RADIO ON" : "RADIO OFF";
      el.className = "pill " + (on ? "ok" : "warn");
    });
    invoke("list_mesh_network_nodes_cmd", {}, function (err, nodes) {
      if (err || !nodes || !nodes.length) { renderMsgs([]); return; }
      nodes.sort(function (a, b) { return b.lastMessageAt - a.lastMessageAt; });
      var pick = nodes.slice(0, 3), rows = [], left = pick.length;
      pick.forEach(function (n) {
        invoke("list_mesh_chats_for_node_cmd", { nodeId: n.nodeId, limit: 5 }, function (e2, list) {
          if (!e2 && list) list.forEach(function (r) { r.username = n.username; rows.push(r); });
          if (--left === 0) renderMsgs(rows);
        });
      });
    });
  }

  function refresh() {
    invoke("get_watch_brief", { withAi: false }, function (err, brief) {
      if (err) {
        if (isAuthError(err)) { setToken(null); return showLogin(); }
        $("headline").textContent = err.message;
        $("headline").className = "headline warn";
      } else {
        renderBrief(brief);
      }
      $("updated").textContent = "Updated " + hhmm(new Date());
    });
    loadMesh();
  }

  function startLoop() {
    show("login", false); show("main", true); show("signout", true);
    refresh();
    if (timer) clearInterval(timer);
    timer = setInterval(refresh, REFRESH);
  }

  function showLogin() {
    if (timer) { clearInterval(timer); timer = null; }
    show("main", false); show("signout", false); show("login", true);
    $("name").focus();
  }

  $("login").onsubmit = function (e) {
    e.preventDefault();
    $("loginErr").textContent = "";
    invoke("authenticate_pin", { name: $("name").value.trim(), pin: $("pin").value }, function (err) {
      $("pin").value = "";
      if (err) { $("loginErr").textContent = err.message; return; }
      startLoop();
    });
  };

  $("signout").onclick = function (e) {
    e.preventDefault();
    invoke("logout", {}, function () {});
    setToken(null);
    showLogin();
  };

  tickClock();
  setInterval(tickClock, 15000);
  if (getToken()) {
    invoke("refresh_auth_session", {}, function (err) { if (err) { setToken(null); showLogin(); } else startLoop(); });
  } else {
    showLogin();
  }
})();
</script>
</body>
</html>

; ATHENA Handheld — firmware for the ESP32-2432S028 "Cheap Yellow Display" (2.8" 320x240 touch).
;   Build:   pio run
;   Flash:   pio run -t upload --upload-port /dev/cu.usbserial-10
;   Monitor: pio device monitor
[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 230400  ; this board's CH340 drops bytes at 460800+
build_flags =
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  lovyan03/LovyanGFX@1.1.16
  bblanchon/ArduinoJson@7.2.1
  tzapu/WiFiManager@2.0.17
